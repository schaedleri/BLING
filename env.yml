# Note: QIIME2 is officially distributed with its own dedicated conda
# environment (see https://docs.qiime2.org for the current installation
# recipe) and is usually incompatible with being installed alongside other
# packages in one environment. In practice, stage 1 (16S processing) is run
# in a separate QIIME2 environment, and stages 2 onward use this one.
name: bling
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels
  - matplotlib
  - openpyxl
  - goatools
  - blast
  - cd-hit
  - interproscan
  - eggnog-mapper
  - qiime2
  - pip
  - pip:
      - pyyaml
